name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.13.5"
  APP_ENV: test
  SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clinical_trials_test
  DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@localhost:5432/clinical_trials_test
  REDIS_URL: redis://localhost:6379/0
  AUTO_CREATE_TABLES: "false"
  RATE_LIMIT_ENABLED: "false"
  LLM_PROVIDER: local
  TRUSTED_HOSTS: testserver,localhost,127.0.0.1
  CORS_ORIGINS: http://testserver
  LOG_LEVEL: WARNING

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinical_trials_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint production modules
        run: |
          uv run ruff check \
            src/clinical_trial_matcher/api \
            src/clinical_trial_matcher/core \
            src/clinical_trial_matcher/db \
            src/clinical_trial_matcher/schemas/auth.py \
            src/clinical_trial_matcher/main.py \
            tests/unit tests/conftest.py scripts alembic
          uv run ruff format --check \
            src/clinical_trial_matcher/api \
            src/clinical_trial_matcher/core \
            src/clinical_trial_matcher/db \
            src/clinical_trial_matcher/schemas/auth.py \
            src/clinical_trial_matcher/main.py \
            tests/unit tests/conftest.py scripts alembic

      - name: Type-check production modules
        run: |
          uv run mypy \
            src/clinical_trial_matcher/api \
            src/clinical_trial_matcher/core \
            src/clinical_trial_matcher/db \
            src/clinical_trial_matcher/schemas/auth.py \
            src/clinical_trial_matcher/main.py

      - name: Verify migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests
        run: uv run pytest -q --cov=clinical_trial_matcher --cov-report=term-missing

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: clinical-trial-matcher-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
