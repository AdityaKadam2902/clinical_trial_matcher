[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-trial-matcher"
version = "1.0.0"
description = "AI-powered clinical trial matching platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Clinical Trial Matcher" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-dotenv>=1.0,<2.0",
    "langgraph>=0.2,<2.0",
    "langchain>=0.3,<2.0",
    "langchain-groq>=0.2,<2.0",
    "dspy-ai>=2.5,<4.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "psycopg2-binary>=2.9,<3.0",
    "qdrant-client>=1.11,<2.0",
    "httpx>=0.27,<1.0",
    "aiohttp>=3.10,<4.0",
    "tenacity>=9.0,<10.0",
    "loguru>=0.7,<1.0",
    "orjson>=3.10,<4.0",
    "slowapi>=0.1.9,<1.0",
    "redis>=5.0,<6.0",
    "pyjwt>=2.9,<3.0",
    "pwdlib[argon2]>=0.2,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "email-validator>=2.2,<3.0",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
    "pip-audit>=2.7,<3.0",
    "bandit>=1.7,<2.0",
    "pre-commit>=3.8,<5.0",
]

[tool.uv]
# Transitive pins for security fixes. Keep `uv.lock` and requirements.txt in sync.
constraint-dependencies = [
    "filelock>=4.2.1,<5.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["clinical_trial_matcher"]
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["dspy", "dspy.*"]
ignore_missing_imports = true
